// Custom Palisade - model config (pattern from the official DayZ-Samples).
// Named selections of cp_palisade_wall.p3d are prepared as hide animations
// for the construction stages; with no animation source they stay visible.

class CfgSkeletons
{
	class Default
	{
		isDiscrete = 1;
		skeletonInherit = "";
		skeletonBones[] = {};
	};
	class CP_PalisadeWall_Skeleton: Default
	{
		skeletonInherit = "Default";
		skeletonBones[] =
		{
			"base", "",
			"wall_down", "",
			"wall_up", "",
			"spikes", ""
		};
	};
};

class CfgModels
{
	class Default
	{
		sectionsInherit = "";
		sections[] = {};
		skeletonName = "";
	};
	class cp_palisade_wall: Default
	{
		skeletonName = "CP_PalisadeWall_Skeleton";
		class Animations
		{
			class base
			{
				type = "hide";
				source = "base";
				selection = "base";
				minValue = 0;
				maxValue = 1;
				hideValue = 0.01;
			};
			class wall_down: base
			{
				source = "wall_down";
				selection = "wall_down";
			};
			class wall_up: base
			{
				source = "wall_up";
				selection = "wall_up";
			};
			class spikes: base
			{
				source = "spikes";
				selection = "spikes";
			};
		};
	};
};
