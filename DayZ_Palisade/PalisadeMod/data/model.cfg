// Template model.cfg for palisade.p3d
// Every construction part has its own bone/selection + "hide" animation.
// The selections must exist in Resolution LODs AND in Geometry / Fire Geometry / View Geometry LODs,
// so that collisions appear only when the part is built.
class CfgSkeletons
{
	class Palisade_Skeleton
	{
		skeletonInherit = "";
		isDiscrete = 1;
		SkeletonBones[] =
		{
			"base", "",
			"wall_down", "",
			"wall_up", "",
			"spikes", ""
		};
	};
};

class CfgModels
{
	class Default
	{
		sectionsInherit = "";
		sections[] = {};
		skeletonName = "";
	};

	class palisade: Default
	{
		skeletonName = "Palisade_Skeleton";
		sections[] = {};

		class Animations
		{
			class base      { type = "hide"; source = "base";      selection = "base";      minValue = 0; maxValue = 1; hideValue = 0.001; };
			class wall_down { type = "hide"; source = "wall_down"; selection = "wall_down"; minValue = 0; maxValue = 1; hideValue = 0.001; };
			class wall_up   { type = "hide"; source = "wall_up";   selection = "wall_up";   minValue = 0; maxValue = 1; hideValue = 0.001; };
			class spikes    { type = "hide"; source = "spikes";    selection = "spikes";    minValue = 0; maxValue = 1; hideValue = 0.001; };
		};
	};

	class palisade_placing: Default {};
};
